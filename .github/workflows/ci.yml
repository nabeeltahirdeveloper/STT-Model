name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv provisions the interpreter from .python-version, so CI and a laptop
      # agree on the Python version without a separate setup-python step.
      - name: Install Python
        run: uv python install

      # Installs from uv.lock, so CI resolves exactly what a contributor did.
      # --locked fails if pyproject.toml and uv.lock have drifted apart, which
      # is the one lockfile failure mode worth catching in CI rather than review.
      - name: Sync dependencies
        run: uv sync --all-extras --all-groups --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q --cov=src --cov-report=term-missing

      # The lexicons are product artifacts, not build output. A row that breaks
      # them breaks every label the project generates, so this runs even though
      # the test suite already loads them.
      - name: Validate lexicons
        run: uv run python -c "from src.labeling.lexicon import Lexicon; print(len(Lexicon.load()), 'entries')"
