# Mirrors `./run.sh check`. If you change a gate here, change it there too.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
        # The transliteration dictionary is 543 KB of data, not a stray binary.
        # It is version controlled on purpose (ADR-014): it is the difference
        # between reproducible labels and labels that depend on which corpus
        # revision someone happened to download. Raising the global limit would
        # let real accidents through, so it is exempted by name instead.
        exclude: ^data/lexicon/transliteration\.tsv$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pydantic>=2, types-pyyaml]
