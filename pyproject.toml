[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roman-urdu-captions"
version = "0.1.0"
description = "Roman Urdu subtitles for code-switched Urdu-English video"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }

# Heavy model/runtime deps live here. Nothing in src/ may import them at module
# scope: Phase 0 work (lint, typecheck, tests, normalizer) must run on a machine
# with no GPU and no torch installed. Import them inside the function that uses them.
dependencies = [
    "torch",
    "qwen-asr",
    "transformers",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
# A real optional feature group, not a dev group: alignment is a shipped
# capability that not every deployment needs (PROJECT.md §4.4).
align = [
    "torchaudio",
    "pyannote.audio",
    "demucs",
]
# flash-attn is CUDA-only and cannot be built in an isolated environment (see
# [tool.uv] below), so it is an extra rather than a runtime dependency and is
# marker-gated to Linux. On macOS `uv sync --all-extras` resolves it to nothing;
# on a training box `./run.sh setup` syncs twice -- once without this extra so
# torch exists, then again so flash-attn can build against it.
cuda = [
    "flash-attn; sys_platform == 'linux'",
    "bitsandbytes; sys_platform == 'linux'",
    "accelerate",
]
train = [
    "peft>=0.14",
]

# PEP 735. Dev tooling is not a feature of the package, so it does not belong in
# optional-dependencies -- a consumer installing `roman-urdu-captions[dev]`
# should not be a thing. This is what `uv add --dev` writes to.
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-pyyaml",
]
labels = [
    "indic-transliteration>=2.3.82",
    "sentencepiece>=0.2.2",
]

[tool.hatch.build.targets.wheel]
# The documented commands are `python -m src.eval.score`, `python -m src.api.pipeline`
# etc. (CLAUDE.md > Commands), so the import root is literally `src`.
packages = ["src"]

# --------------------------------------------------------------------------- #
# uv
# --------------------------------------------------------------------------- #
[tool.uv]
# flash-attn's setup.py imports torch to read the CUDA version, so it cannot be
# built in uv's default isolated build environment. This is only reachable on a
# CUDA machine; it is inert elsewhere.
no-build-isolation-package = ["flash-attn"]

# NOTE: no CUDA index is configured. This machine reports no NVIDIA GPU
# (`nvidia-smi` absent), so torch resolves to the default PyPI build. On a
# training box, add the matching index -- e.g. for CUDA 12.4:
#
#   [tool.uv.sources]
#   torch = [{ index = "pytorch-cu124" }]
#   torchaudio = [{ index = "pytorch-cu124" }]
#
#   [[tool.uv.index]]
#   name = "pytorch-cu124"
#   url = "https://download.pytorch.org/whl/cu124"
#   explicit = true
#
# Match the CUDA version to `nvidia-smi`, and re-run `uv lock` after adding it.

# --------------------------------------------------------------------------- #
# Lint
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal spelling pairs; long table rows are more readable unwrapped.
"tests/*" = ["E501"]

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

# Model/audio stacks ship incomplete or absent stubs. Phase 0 does not install them.
[[tool.mypy.overrides]]
module = [
    "demucs.*",
    "pyannote.*",
    "qwen_asr.*",
    # CUDA-only, so it is never installed on the machine mypy runs on.
    "bitsandbytes.*",
    "torch.*",
    "torchaudio.*",
    "transformers.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "spec: a test case transcribed directly from docs/SPELLING-SPEC.md",
]

[tool.coverage.run]
source = ["src"]
